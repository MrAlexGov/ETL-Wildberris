version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    container_name: wb_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wb_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wb_pass}
      POSTGRES_DB: ${POSTGRES_DB:-wb_analytics}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: wb_redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: wb_backend
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
    ports:
      - "8000:8000"

  worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: wb_worker
    command: ["celery", "-A", "app.tasks.celery_app", "worker", "-l", "info"]
    env_file:
      - .env
    depends_on:
      - backend
      - redis
      - postgres

  beat:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: wb_beat
    command: ["celery", "-A", "app.tasks.celery_app", "beat", "-l", "info"]
    env_file:
      - .env
    depends_on:
      - backend
      - redis
      - postgres

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: wb_frontend
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  postgres_data:
  redis_data: